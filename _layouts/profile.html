<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="{{ page.description | default: site.description | escape }}">
<title>{% if page.permalink == '/' %}Yuxiao Li | Researcher{% else %}{{ page.title | escape }} | Yuxiao Li{% endif %}</title>
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="{{ '/assets/images/yl-mark.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/profile.css' | relative_url }}">
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<header class="topbar">
  <div class="container header-row">
    <a class="brand" href="{{ '/' | relative_url }}">Yuxiao Li<span class="brand-period">.</span></a>
    <nav class="desktop-nav" aria-label="Main navigation">
      <a {% if page.permalink == '/' %}aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Home</a>
      <a {% if page.permalink == '/research/' %}aria-current="page"{% endif %} href="{{ '/research/' | relative_url }}">Research</a>
      <a {% if page.permalink == '/publications/' %}aria-current="page"{% endif %} href="{{ '/publications/' | relative_url }}">Publications</a>
      <a {% if page.permalink == '/experience/' %}aria-current="page"{% endif %} href="{{ '/experience/' | relative_url }}">Experience</a>
      <a {% if page.permalink == '/cv/' %}aria-current="page"{% endif %} href="{{ '/cv/' | relative_url }}">CV</a>
    </nav>
    <details class="mobile-nav">
      <summary aria-label="Toggle navigation">Menu <span aria-hidden="true">☰</span></summary>
      <nav aria-label="Mobile navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/research/' | relative_url }}">Research</a>
        <a href="{{ '/publications/' | relative_url }}">Publications</a>
        <a href="{{ '/experience/' | relative_url }}">Experience</a>
        <a href="{{ '/cv/' | relative_url }}">CV</a>
        <a href="{{ '/teaching/' | relative_url }}">Teaching</a>
      </nav>
    </details>
  </div>
</header>
<main id="content" class="container">{{ content }}</main>
<footer class="site-footer">
  <div class="container footer-row">
    <span>© {{ site.time | date: '%Y' }} Yuxiao Li</span>
    <div class="footer-links">
      <a href="{{ '/teaching/' | relative_url }}">Teaching</a>
      <a href="https://scholar.google.com/citations?user=13Al7_kAAAAJ&amp;hl=en" target="_blank" rel="noopener noreferrer">Google Scholar ↗</a>
      <a href="https://github.com/YuxiaoLee" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      <a href="https://www.linkedin.com/in/yuxiao-li-44387524a/" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
      <a href="mailto:li.yuxiao@northeastern.edu">Email ↗</a>
    </div>
  </div>
</footer>
</body>
</html>
